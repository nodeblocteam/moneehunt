<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2631" />
      <stop offset="100%" stop-color="#141B24" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6AA3A" />
      <stop offset="100%" stop-color="#C78B27" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="96" fill="url(#bg)"/>

  <!-- Outer Crosshair Circle -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="#2C3746" stroke-width="12"/>

  <!-- Target Crosshair Ticks -->
  <line x1="250" y1="65" x2="250" y2="115" stroke="#2C3746" stroke-width="14" stroke-linecap="round"/>
  <line x1="250" y1="385" x2="250" y2="435" stroke="#2C3746" stroke-width="14" stroke-linecap="round"/>
  <line x1="65" y1="250" x2="115" y2="250" stroke="#2C3746" stroke-width="14" stroke-linecap="round"/>
  <line x1="385" y1="250" x2="435" y2="250" stroke="#2C3746" stroke-width="14" stroke-linecap="round"/>

  <!-- Gold Escrow Diamond -->
  <rect x="175" y="175" width="150" height="150" rx="28" transform="rotate(45 250 250)" fill="url(#gold)"/>
  <rect x="187" y="187" width="126" height="126" rx="20" transform="rotate(45 250 250)" fill="none" stroke="#1E2631" stroke-width="8"/>

  <!-- Center Pin Icon -->
  <path d="M 250 190 C 222 190, 202 215, 202 245 C 202 280, 250 330, 250 330 C 250 330, 298 280, 298 245 C 298 215, 278 190, 250 190 Z" fill="#1E2631"/>

  <!-- Keyhole -->
  <circle cx="250" cy="235" r="14" fill="url(#gold)"/>
  <polygon points="241,235 259,235 264,270 236,270" fill="url(#gold)"/>
</svg>
